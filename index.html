<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08080a" />
<meta name="color-scheme" content="dark" />
<title>占有欲调查 · 番外</title>
<style>
  :root{
    --bg:#08080a;
    --line:rgba(255,255,255,.07);
    --txt:#cdccd2;
    --dim:#6a6873;
    --acc:#9c2b22;
    --acc2:#d24a35;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(120% 70% at 50% -12%, rgba(156,43,34,.15), transparent 62%),
      radial-gradient(90% 60% at 50% 118%, rgba(46,62,92,.12), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:"Songti SC","SimSun","Noto Serif SC",Georgia,serif;
    line-height:1.8;
    letter-spacing:.02em;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>");
  }
  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.6) 100%);
  }
  .flash{
    position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;
    background:radial-gradient(120% 80% at 50% 55%, transparent 30%, rgba(120,20,14,.5) 100%);
    transition:opacity .5s ease;
  }
  .flash.on{opacity:1;transition:opacity .12s ease}

  .hud{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 0;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.22em;color:#7a5a55;
    pointer-events:none;
  }
  .hud > *{pointer-events:auto}
  .counter{opacity:.85;transition:opacity .4s ease}
  .counter.dim{opacity:.25}
  .snd{
    border:1px solid var(--line);
    background:rgba(255,255,255,.02);
    color:#8a6f6a;font-family:inherit;font-size:10.5px;letter-spacing:.2em;
    padding:6px 10px;border-radius:8px;cursor:pointer;
    transition:.25s ease;
  }
  .snd.off{color:#4a4854;border-color:rgba(255,255,255,.045)}
  .bar{
    position:fixed;top:0;left:0;height:2px;width:100%;z-index:55;
    transform:scaleX(0);transform-origin:0 50%;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 12px rgba(210,74,53,.5);
    transition:transform .55s cubic-bezier(.2,.8,.25,1);
    will-change:transform;
  }

  .shell{flex:1;display:flex;min-height:0}
  .centerer{
    margin:auto;width:100%;max-width:640px;
    padding:92px 18px 84px;
    position:relative;
  }

  .intro{transition:opacity .5s ease}
  .kicker{
    font-size:11px;letter-spacing:.42em;color:#7a5a55;margin-bottom:20px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  h1{
    font-size:32px;line-height:1.35;margin:0 0 16px;font-weight:400;
    color:#e8e4e2;letter-spacing:.14em;
    text-shadow:0 0 26px rgba(210,74,53,.16);
  }
  .sub{font-size:13.5px;color:var(--dim);margin:0 0 34px;letter-spacing:.06em;line-height:2}
  .start{
    width:100%;padding:16px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(210,74,53,.42);
    background:linear-gradient(180deg,rgba(156,43,34,.24),rgba(156,43,34,.08));
    color:#f2e9e6;font-family:inherit;font-size:14.5px;letter-spacing:.34em;
    transition:.25s ease;
  }
  .start:hover{border-color:rgba(210,74,53,.8);box-shadow:0 0 22px rgba(156,43,34,.26)}
  .start:active{transform:scale(.99)}
  .hint{
    font-size:11.5px;color:#4e4c58;letter-spacing:.12em;
    text-align:center;margin:16px 0 0;line-height:2;
  }

  .stage{width:100%;position:relative}
  .step{
    width:100%;
    opacity:0;
    transform:translate3d(0,16px,0);
    transition:opacity .34s ease, transform .42s cubic-bezier(.2,.8,.25,1);
    will-change:opacity,transform;
  }
  .step.in{opacity:1;transform:translate3d(0,0,0)}
  .step.out{
    opacity:0;transform:translate3d(0,-12px,0);
    transition-duration:.26s;
    pointer-events:none;
    position:absolute;left:0;right:0;top:0;
  }
  .step.gone{opacity:0;transform:translate3d(0,-6px,0);transition:opacity .8s ease, transform .8s ease}

  .qno{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11.5px;color:#8a4a41;letter-spacing:.28em;
    margin-bottom:14px;display:block;
  }
  .qtitle{
    font-size:19px;font-weight:400;margin:0 0 12px;
    color:#ddd9d7;line-height:1.75;letter-spacing:.03em;
  }
  .qtitle.small{font-size:16.5px}
  .qnote{
    font-size:12px;color:#544a4e;letter-spacing:.1em;margin:0 0 22px;
    font-style:italic;
  }
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:13px 15px;margin:9px 0;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.016);
    color:var(--txt);font-family:inherit;font-size:15px;
    cursor:pointer;transition:border-color .2s ease, background .2s ease, color .2s ease;
    letter-spacing:.04em;
  }
  .opt::before{
    content:"";width:7px;height:7px;border:1px solid #4a4854;border-radius:50%;
    flex:0 0 auto;transition:background .2s ease,border-color .2s ease;
  }
  .opt:active{transform:scale(.985)}
  .opt.on{
    border-color:rgba(210,74,53,.5);
    background:rgba(156,43,34,.13);
    color:#f0e8e5;
  }
  .opt.on::before{
    background:var(--acc2);border-color:var(--acc2);
    box-shadow:0 0 10px rgba(210,74,53,.85);
  }

  .inp{
    display:block;width:100%;margin-top:4px;
    background:rgba(0,0,0,.42);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:13px 14px;
    font-family:inherit;font-size:15px;line-height:1.75;
    resize:vertical;outline:none;transition:border-color .2s ease;
    min-height:96px;
  }
  .inp::placeholder{color:#4e4c58}
  .inp:focus{border-color:rgba(210,74,53,.5);background:rgba(0,0,0,.58)}

  .nav{display:flex;align-items:center;gap:12px;margin-top:26px}
  .nav button{
    padding:13px;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:13px;letter-spacing:.22em;
    background:transparent;transition:.25s ease;
    border:1px solid var(--line);color:#6f6d79;
  }
  .nav button:active{transform:scale(.99)}
  .nav .back{flex:0 0 auto;padding:11px 18px;font-size:11.5px;letter-spacing:.18em}
  .nav .next{
    flex:1;border-color:rgba(210,74,53,.4);color:#e8dad6;
    background:rgba(156,43,34,.14);
  }
  .nav .next:hover{border-color:rgba(210,74,53,.75)}
  .nav .back:hover{color:#b9b3b1;border-color:rgba(255,255,255,.14)}

  .ghost{
    font-size:12px;color:#4c4a56;letter-spacing:.18em;
    padding:8px 0 0 2px;line-height:2.2;
    opacity:0;transition:opacity 1.2s ease;
  }
  .ghost.in{opacity:1}

  .result{
    border:1px solid var(--line);border-radius:14px;padding:30px 22px;
    background:linear-gradient(180deg,rgba(156,43,34,.1),rgba(255,255,255,.008));
    opacity:0;transform:translate3d(0,14px,0);
    transition:opacity .6s ease, transform .6s ease;
  }
  .result.in{opacity:1;transform:none}
  .rtitle{font-size:21px;letter-spacing:.3em;color:#e8e1de;margin-bottom:18px}
  .rline{font-size:15px;color:#c2bcb9;margin:0 0 10px;line-height:2}
  .rline2{font-size:13px;color:#7d6d6c;margin:0 0 24px;line-height:2}
  .rsub{font-size:12px;color:#57555f;margin:0 0 22px;letter-spacing:.06em;line-height:2}
  .sheet{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:14px 0;margin:0 0 24px;
    font-size:12px;color:#6b6874;line-height:2.1;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .sheet b{color:#a8938f;font-weight:400;margin-right:8px}
  .go{
    display:block;text-align:center;text-decoration:none;padding:15px;border-radius:12px;
    border:1px solid rgba(210,74,53,.4);color:#efdcd7;font-size:13px;letter-spacing:.22em;
    background:rgba(156,43,34,.12);transition:.25s ease;
  }
  .go:hover{border-color:rgba(210,74,53,.8)}

  footer{text-align:center;padding:0 0 26px}
  footer a{color:#5b4844;font-size:11.5px;text-decoration:none;letter-spacing:.16em}
  footer a:hover{color:var(--acc2)}

  .wisp{
    position:fixed;left:50%;bottom:20%;transform:translateX(-50%);
    font-size:12px;color:#5c5a66;letter-spacing:.3em;pointer-events:none;
    opacity:0;transition:opacity 1.2s ease;z-index:8;white-space:nowrap;
  }
  .wisp.show{opacity:1}

  .ink{
    position:fixed;right:20px;bottom:18px;z-index:8;pointer-events:none;
    font-size:11px;color:#4a4a54;letter-spacing:.24em;
    opacity:0;transition:opacity .8s ease;
  }
  .ink.show{opacity:1}
</style>
</head>
<body>

<div class="bar" id="bar"></div>
<div class="vig"></div>
<div class="flash" id="flash"></div>
<div class="grain"></div>

<div class="hud">
  <span class="counter dim" id="counter">— / —</span>
  <button class="snd" id="snd">声 音 开</button>
</div>

<div class="shell">
  <div class="centerer">
    <section class="intro" id="intro">
      <div class="kicker">番外 · 夜间场 · NO.0004</div>
      <h1>占有欲调查</h1>
      <p class="sub">十一题。请如实回答。<br>不记名。但会有人看见。</p>
      <button class="start" id="startBtn">开 始 回 答</button>
      <p class="hint">建议戴耳机。房间安静一点更好。<br>如果你听见呼吸声——那不是设备的问题。</p>
    </section>

    <section class="stage" id="stage"></section>
  </div>
</div>

<footer>
  <a href="https://wenjuan.uc99.com" target="_blank" rel="noopener">wenjuan.uc99.com</a>
</footer>

<div class="wisp" id="wisp"></div>
<div class="ink" id="ink"></div>

<script>
/* ==========================================================
   一、音频引擎：全部现场合成，不加载任何外部文件
   ========================================================== */
const AE = {
  ctx:null, master:null, noiseBuf:null, ambBus:null, heartBus:null,
  droneOscs:[], heartTimer:null, breathTimer:null,
  muted:false, ambienceOn:false, p:0, interval:[7600,13500],

  boot(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    const ctx = this.ctx = new AC();

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 14;
    comp.ratio.value = 4;
    comp.attack.value = 0.004;
    comp.release.value = 0.25;

    this.master = ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(comp);
    comp.connect(ctx.destination);

    this.noiseBuf = this.makeNoise(6);
    return true;
  },

  resume(){
    if(this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },

  makeNoise(sec){
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.021 * w) / 1.021;
      d[i] = last * 3.4;
    }
    const fade = Math.min(1200, Math.floor(len / 6));
    for(let i = 0; i < fade; i++){
      const a = i / fade;
      d[i] *= a;
      d[len - 1 - i] *= a;
    }
    return buf;
  },

  startAmbience(){
    if(!this.ctx || this.ambienceOn) return;
    this.ambienceOn = true;
    const ctx = this.ctx;
    const now = ctx.currentTime;

    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0.0001, now);
    bus.gain.linearRampToValueAtTime(0.5, now + 7);
    bus.connect(this.master);
    this.ambBus = bus;

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 300;
    lp.Q.value = 0.9;

    const dg = ctx.createGain();
    dg.gain.value = 0.09;
    lp.connect(dg);
    dg.connect(bus);

    [[48.9, 0.55], [73.3, 0.34], [98.2, 0.16]].forEach((pair, i) => {
      const o = ctx.createOscillator();
      o.type = i === 2 ? "triangle" : "sine";
      o.frequency.value = pair[0];
      o.__base = pair[0];
      const g = ctx.createGain();
      g.gain.value = pair[1];
      o.connect(g);
      g.connect(lp);
      o.start();
      this.droneOscs.push(o);
    });

    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.043;
    const lg = ctx.createGain();
    lg.gain.value = 110;
    lfo.connect(lg);
    lg.connect(lp.frequency);
    lfo.start();

    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    ns.loop = true;
    const nf = ctx.createBiquadFilter();
    nf.type = "lowpass";
    nf.frequency.value = 430;
    const ng = ctx.createGain();
    ng.gain.value = 0.055;
    const nlfo = ctx.createOscillator();
    nlfo.frequency.value = 0.068;
    const nlg = ctx.createGain();
    nlg.gain.value = 0.032;
    nlfo.connect(nlg);
    nlg.connect(ng.gain);
    nlfo.start();
    ns.connect(nf);
    nf.connect(ng);
    ng.connect(bus);
    ns.start();

    this.heartBus = ctx.createGain();
    this.heartBus.gain.value = 0.95;
    this.heartBus.connect(this.master);

    this.heartLoop();
    this.breathLoop();
  },

  pressure(v){
    this.p = Math.max(0, Math.min(1, v));
    if(!this.ctx) return;
    const now = this.ctx.currentTime;
    this.droneOscs.forEach(o => {
      o.frequency.setTargetAtTime(o.__base * (1 + this.p * 0.07), now, 2.2);
    });
    this.interval = [7600 - this.p * 4200, 13500 - this.p * 7000];
  },

  heartLoop(){
    clearTimeout(this.heartTimer);
    const lo = Math.max(2200, this.interval[0]);
    const hi = Math.max(lo + 1200, this.interval[1]);
    this.heartTimer = setTimeout(() => {
      this.beat();
      this.heartLoop();
    }, lo + Math.random() * (hi - lo));
  },

  beat(){
    const ctx = this.ctx;
    if(!ctx || !this.heartBus) return;
    const t0 = ctx.currentTime;

    const thump = (at, f0, f1, dur, vol) => {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(f0, at);
      o.frequency.exponentialRampToValueAtTime(f1, at + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g);
      g.connect(this.heartBus);
      o.start(at);
      o.stop(at + dur + 0.05);

      const o2 = ctx.createOscillator();
      o2.type = "triangle";
      o2.frequency.setValueAtTime(f0 * 2.7, at);
      o2.frequency.exponentialRampToValueAtTime(f1 * 2.3, at + dur * 0.8);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, at);
      g2.gain.exponentialRampToValueAtTime(vol * 0.55, at + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, at + dur * 0.65);
      o2.connect(g2);
      g2.connect(this.heartBus);
      o2.start(at);
      o2.stop(at + dur + 0.05);

      const ns = ctx.createBufferSource();
      ns.buffer = this.noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 620;
      bp.Q.value = 0.7;
      const g3 = ctx.createGain();
      g3.gain.setValueAtTime(0.0001, at);
      g3.gain.exponentialRampToValueAtTime(vol * 0.42, at + 0.006);
      g3.gain.exponentialRampToValueAtTime(0.0001, at + 0.075);
      ns.connect(bp);
      bp.connect(g3);
      g3.connect(this.heartBus);
      ns.start(at);
      ns.stop(at + 0.1);
    };

    thump(t0, 104, 62, 0.26, 0.3);
    thump(t0 + 0.34, 92, 54, 0.3, 0.17);
  },

  breathLoop(){
    clearTimeout(this.breathTimer);
    this.breathTimer = setTimeout(() => {
      this.breath();
      this.breathLoop();
    }, 17000 + Math.random() * 21000);
  },

  breath(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(320, t);
    bp.frequency.linearRampToValueAtTime(760, t + 0.7);
    bp.frequency.linearRampToValueAtTime(360, t + 1.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    ns.connect(bp);
    bp.connect(g);
    g.connect(this.master);
    ns.start(t);
    ns.stop(t + 1.6);
  },

  enterTone(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;

    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(146, t);
    o.frequency.exponentialRampToValueAtTime(86, t + 0.9);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.13);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + 1.15);

    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 1500;
    bp.Q.value = 0.8;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.linearRampToValueAtTime(0.042, t + 0.05);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    ns.connect(bp);
    bp.connect(ng);
    ng.connect(this.master);
    ns.start(t);
    ns.stop(t + 0.6);
  },

  click(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(90, t + 0.09);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + 0.16);

    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 2000;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.05, t + 0.005);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    ns.connect(hp);
    hp.connect(ng);
    ng.connect(this.master);
    ns.start(t);
    ns.stop(t + 0.1);
  },

  tick(vol){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "square";
    o.frequency.value = 1420;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.045, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + 0.07);
  },

  vanish(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;

    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    ns.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 2.4;
    bp.frequency.setValueAtTime(280, t);
    bp.frequency.exponentialRampToValueAtTime(3600, t + 0.55);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.13, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.64);
    ns.connect(bp);
    bp.connect(g);
    g.connect(this.master);
    ns.start(t);
    ns.stop(t + 0.75);

    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(72, t + 0.55);
    o.frequency.exponentialRampToValueAtTime(33, t + 1.35);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t + 0.55);
    og.gain.linearRampToValueAtTime(0.24, t + 0.62);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(og);
    og.connect(this.master);
    o.start(t + 0.5);
    o.stop(t + 1.7);
  },

  whisper(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    const ns = ctx.createBufferSource();
    ns.buffer = this.noiseBuf;
    ns.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 960;
    bp.Q.value = 5.5;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 5.2;
    const lg = ctx.createGain();
    lg.gain.value = 300;
    lfo.connect(lg);
    lg.connect(bp.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    ns.connect(bp);
    bp.connect(g);
    g.connect(this.master);
    ns.start(t);
    ns.stop(t + 1.6);
    lfo.start(t);
    lfo.stop(t + 1.6);
  },

  knock(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    [0, 0.29].forEach((d, i) => {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(132, t + d);
      o.frequency.exponentialRampToValueAtTime(74, t + d + 0.16);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.16 - i * 0.04, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
      o.connect(g);
      g.connect(this.master);
      o.start(t + d);
      o.stop(t + d + 0.26);
    });
  },

  finalChord(){
    const ctx = this.ctx;
    if(!ctx) return;
    const t = ctx.currentTime;
    [41.2, 61.8, 82.4, 123.5].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = "sine";
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.1 / (i + 1), t + 1.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 6.5);
      o.connect(g);
      g.connect(this.master);
      o.start(t);
      o.stop(t + 6.8);
    });
  },

  setMuted(v){
    this.muted = v;
    if(!this.ctx) return;
    const now = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setTargetAtTime(v ? 0.0001 : 0.9, now, 0.2);
  }
};

/* ==========================================================
   二、题目数据
   ========================================================== */
const Q1_FOLLOW = [
  { id:"q1a", no:"01.1", title:"您对于朋友之间的占有欲接受程度", type:"choice",
    note:"换一个身份，答案会变吗。",
    options:["不接受","不理解","一般无感","能接受但不理解","完全能接受"] },
  { id:"q1b", no:"01.2", title:"您对于恋人之间的占有欲接受程度", type:"choice",
    note:"这一题你答得最快。",
    options:["不接受","不理解","一般无感","能接受但不理解","完全能接受"] },
  { id:"q1c", no:"01.3", title:"您对于家人之间的占有欲接受程度", type:"choice",
    note:"不算爱的那种占有，也算。",
    options:["不接受","不理解","一般无感","能接受但不理解","完全能接受"] },
  { id:"q1d", no:"01.4", title:"您对于师生之间的占有欲接受程度", type:"choice",
    note:"有人在看这道题。",
    options:["不接受","不理解","一般无感","能接受但不理解","完全能接受"] },
  { id:"q1e", no:"01.5", title:"更多补充", type:"text", small:true,
    note:"写不下也可以。它记得你没写的那部分。",
    placeholder:"还有什么想说的……" }
];

const BASE = [
  { id:"q1", no:"01",
    title:"您能接受人与人之间的占有欲吗（任意一段关系）？",
    note:"没有标准答案。只是有人想知道。",
    type:"choice", options:["不能","不知道","能"] },

  { id:"q2", no:"02",
    title:"一段关系中，通常您的占有欲更强还是对方？",
    note:"想清楚再选。它会记下来。",
    type:"choice", options:["无","一样","您","对方"] },

  { id:"q3", no:"03",
    title:"一段关系中，您对于唯一性的追求程度",
    note:"这个词在指什么，你比谁都清楚。",
    type:"choice", options:["低","中低","中","中高","高"] },

  { id:"q4", no:"04",
    title:"您对我存在和我对您一样的占有欲吗？",
    note:"三秒。别想太久。",
    type:"choice", options:["不存在","存在","其他原因"],
    extraText:"请补充……",
    ephemeral:3000 },

  { id:"q5", no:"04",
    title:"您能接受在意的人身边有很多朋友吗？",
    note:"朋友。很多个朋友。",
    type:"choice", options:["绝对不能","吃醋但能克制","完全可以"] },

  { id:"q6", no:"05",
    title:"您的手机是否一直保持在触手可及的范围内，并且时刻期待收到某个人的信息？",
    note:"它就在你手边。",
    type:"choice", options:["从不","偶尔","经常","屏幕亮起就立刻查看"] },

  { id:"q7", no:"06",
    title:"如果在已经互道晚安后的深夜，您发现对方依旧在线上活跃或有他人的互动，您会：",
    note:"那个时间点，你心里有数。",
    type:"choice", options:["毫不在意","默默记下于次日试探","立刻质问","感到被背叛，使用手段调查"] },

  { id:"q8", no:"07",
    title:"收到一条未知号码发来的：“我已经看着你很久了，你为什么不看我。”",
    note:"你看了一眼。没有立刻删。",
    type:"choice", options:["无感，直接拉黑","感到害怕并检查门窗","想找出对方是谁"] },

  { id:"q9", no:"08",
    title:"面对试图用亲密举动试探您的人，您的内心倾向于：",
    note:"试探从来不是单方面的。",
    type:"choice", options:["抗拒并保持距离","可以配合但保持清醒","对这种依赖感到满足","渴望被彻底占有"] },

  { id:"q10", no:"09",
    title:"如果有人在深夜潜藏在您的房间里，并且要求您回答完这份问卷，您此刻最想对躲在暗处的人说什么？",
    note:"房间里只有你和它。别回头确认。",
    type:"choice", options:["请立刻离开","你到底想要什么","你怎么才肯放过我","我看见你了，进来吧"] },

  { id:"q11", no:"10",
    title:"此刻，我也在注视着您。告诉我，您也像我在意您一样在意我。",
    note:"写完，停一下，再交。",
    type:"text", placeholder:"写下你的答案……" }
];

const EPITAPH = {
  "请立刻离开":"门是锁着的。你没有听见任何脚步离开的声音。",
  "你到底想要什么":"答案。你已经给了。",
  "你怎么才肯放过我":"等你写完。",
  "我看见你了，进来吧":"……那我就进来了。"
};

const WISPS = [
  "别回头。",
  "他在数你选了几个字。",
  "你的手指停在屏幕上了。",
  "有人在读这道题，比你快一点。",
  "它记得你上一次犹豫的地方。",
  "屏幕的反光里，多了一个影子。",
  "灯关了吗。",
  "你身后那面墙，刚才没有这么近。"
];

const INKS = ["……记下了。", "……嗯。", "……继续。", "……这个答案，他好像不满意。"];

/* ==========================================================
   三、状态与渲染
   ========================================================== */
const answers = {};
let flow = [];
let idx = 0;
let stepToken = 0;
let tickTimers = [];
let vanishTimer = null;
let wispDone = false;

const stage    = document.getElementById("stage");
const bar      = document.getElementById("bar");
const counter  = document.getElementById("counter");
const introEl  = document.getElementById("intro");
const sndBtn   = document.getElementById("snd");
const wispEl   = document.getElementById("wisp");
const inkEl    = document.getElementById("ink");
const flashEl  = document.getElementById("flash");

function rebuildFlow(){
  const keep = new Set();
  flow = [];
  BASE.forEach(q => {
    flow.push(q);
    keep.add(q.id);
    if(q.id === "q1" && answers.q1 === "能"){
      Q1_FOLLOW.forEach(it => {
        flow.push(it);
        keep.add(it.id);
      });
    }
  });
  Object.keys(answers).forEach(k => {
    if(!keep.has(k.split("__")[0])) delete answers[k];
  });
}

function clearTimers(){
  tickTimers.forEach(t => clearTimeout(t));
  tickTimers = [];
  clearTimeout(vanishTimer);
  vanishTimer = null;
}

function answeredCount(){
  return flow.filter(q => {
    const v = answers[q.id];
    return v !== undefined && v !== "";
  }).length;
}

function updateHud(){
  if(!flow.length){
    counter.textContent = "— / —";
    bar.style.transform = "scaleX(0)";
    return;
  }
  counter.classList.remove("dim");
  const pad = n => String(n).padStart(2, "0");
  counter.textContent = pad(idx + 1) + " / " + pad(flow.length);
  const p = answeredCount() / flow.length;
  bar.style.transform = "scaleX(" + p.toFixed(3) + ")";
  AE.pressure(Math.min(1, idx / Math.max(1, flow.length - 1)));
}

function buildStepNode(q){
  const sec = document.createElement("section");
  sec.className = "step";
  sec.dataset.qid = q.id;

  const head = document.createElement("span");
  head.className = "qno";
  head.textContent = q.no;
  sec.appendChild(head);

  const h = document.createElement("h2");
  h.className = "qtitle" + (q.small ? " small" : "");
  h.textContent = q.title;
  sec.appendChild(h);

  if(q.note){
    const p = document.createElement("p");
    p.className = "qnote";
    p.textContent = q.note;
    sec.appendChild(p);
  }

  if(q.type === "text"){
    const ta = document.createElement("textarea");
    ta.className = "inp";
    ta.rows = 3;
    ta.placeholder = q.placeholder || "写下你的答案……";
    ta.value = answers[q.id] || "";
    ta.dataset.id = q.id;
    sec.appendChild(ta);
  }else{
    q.options.forEach(o => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt" + (answers[q.id] === o ? " on" : "");
      b.dataset.id = q.id;
      b.dataset.val = o;
      b.textContent = o;
      sec.appendChild(b);
    });
    if(q.extraText){
      const ip = document.createElement("input");
      ip.className = "inp";
      ip.style.minHeight = "0";
      ip.style.marginTop = "12px";
      ip.placeholder = q.extraText;
      ip.value = answers[q.id + "__extra"] || "";
      ip.dataset.id = q.id + "__extra";
      sec.appendChild(ip);
    }
  }
  return sec;
}

function buildNav(q){
  const nav = document.createElement("div");
  nav.className = "nav";

  const back = document.createElement("button");
  back.type = "button";
  back.className = "back";
  back.textContent = "上 一 题";
  back.disabled = idx === 0;
  back.style.opacity = idx === 0 ? ".3" : "1";
  back.addEventListener("click", () => {
    if(idx === 0) return;
    AE.click();
    goTo(idx - 1);
  });
  nav.appendChild(back);

  const last = idx === flow.length - 1;
  const needNext = q.type === "text" || q.ephemeral;
  if(needNext){
    const next = document.createElement("button");
    next.type = "button";
    next.className = "next";
    next.textContent = last ? "交 付 答 案" : "继 续";
    next.addEventListener("click", () => {
      AE.click();
      if(last) finish();
      else goTo(idx + 1);
    });
    nav.appendChild(next);
  }
  return nav;
}

function swapIn(node){
  stage.appendChild(node);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => node.classList.add("in"));
  });
}

function render(){
  const q = flow[idx];
  const token = ++stepToken;

  clearTimers();

  const olds = stage.querySelectorAll(".step, .ghost, .result");
  olds.forEach(el => {
    el.classList.remove("in");
    el.classList.add("out");
    setTimeout(() => el.remove(), 300);
  });

  const node = buildStepNode(q);
  node.appendChild(buildNav(q));
  swapIn(node);

  updateHud();
  AE.enterTone();

  setTimeout(() => {
    if(token !== stepToken) return;
    const ta = node.querySelector("textarea");
    if(ta) ta.focus({ preventScroll:true });
  }, 640);

  if(q.ephemeral) armEphemeral(node, q, token);

  if(q.id === "q10"){
    setTimeout(() => {
      if(token !== stepToken) return;
      AE.knock();
      flash();
    }, 700);
  }

  if(!wispDone && idx >= 3){
    wispDone = true;
    setTimeout(() => {
      if(token !== stepToken) return;
      AE.whisper();
      showWisp();
    }, 2600);
  }
}

function showWisp(){
  wispEl.textContent = WISPS[Math.floor(Math.random() * WISPS.length)];
  wispEl.classList.add("show");
  setTimeout(() => wispEl.classList.remove("show"), 2800);
}

function flash(){
  flashEl.classList.add("on");
  setTimeout(() => flashEl.classList.remove("on"), 140);
}

function ink(){
  inkEl.textContent = INKS[Math.floor(Math.random() * INKS.length)];
  inkEl.classList.add("show");
  setTimeout(() => inkEl.classList.remove("show"), 1500);
}

function armEphemeral(node, q, token){
  [0, 880, 1700, 2340, 2740].forEach((at, i) => {
    tickTimers.push(setTimeout(() => {
      if(token !== stepToken) return;
      AE.tick(i >= 3 ? 0.06 : 0.04);
    }, at));
  });

  vanishTimer = setTimeout(() => {
    if(token !== stepToken) return;
    AE.vanish();
    flash();

    setTimeout(() => {
      if(token !== stepToken) return;
      delete answers[q.id];
      delete answers[q.id + "__extra"];
      node.classList.remove("in");
      node.classList.add("gone");

      setTimeout(() => {
        if(token !== stepToken) return;
        node.remove();
        const ghost = document.createElement("div");
        ghost.className = "ghost";
        ghost.innerHTML = "（这一题已经不见了。答案没有留下。）<br>（但你选的那一下，它就在你身后。）";
        stage.appendChild(ghost);
        requestAnimationFrame(() => ghost.classList.add("in"));
        AE.whisper();
        updateHud();
        setTimeout(() => {
          if(token !== stepToken) return;
          goTo(idx + 1);
        }, 2200);
      }, 700);
    }, 620);
  }, q.ephemeral);
}

function goTo(i){
  if(i < 0) i = 0;
  if(i >= flow.length){ finish(); return; }
  idx = i;
  render();
}

function pick(btn){
  const id = btn.dataset.id;
  const val = btn.dataset.val;
  const q = flow[idx];

  answers[id] = val;
  btn.parentElement.querySelectorAll('.opt[data-id="' + id + '"]').forEach(b => {
    b.classList.toggle("on", b === btn);
  });
  AE.click();
  updateHud();

  if(q.id === "q1"){
    const had = flow.some(x => x.id === "q1a");
    const now = val === "能";
    if(had !== now){
      rebuildFlow();
      updateHud();
    }
  }

  if(q.ephemeral) return;

  const token = stepToken;
  setTimeout(() => {
    if(token !== stepToken) return;
    if(Math.random() < 0.45) ink();
    const ni = idx + 1;
    if(ni >= flow.length) finish();
    else goTo(ni);
  }, 360);
}

function finish(){
  clearTimers();
  AE.finalChord();

  const line = EPITAPH[answers["q10"]] || "你没有看见任何东西。它也什么都没拿走。";
  const count = answeredCount();

  let sheet = "";
  flow.forEach(q => {
    const v = answers[q.id];
    if(v === undefined || v === "") return;
    const short = q.title.length > 14 ? q.title.slice(0, 14) + "…" : q.title;
    sheet += "<div><b>" + q.no + "</b>" + short + " — " + v + "</div>";
  });

  const sec = document.createElement("section");
  sec.className = "result";
  sec.innerHTML =
    '<div class="rtitle">已 记 录</div>' +
    '<p class="rline">' + line + '</p>' +
    '<p class="rline2">还有一件事。你写下的每一句，我都看过了。</p>' +
    '<div class="sheet">' + sheet + '</div>' +
    '<p class="rsub">你留下了 ' + count + ' 个答案。它们只保存在这台设备上，没有上传到任何地方。</p>' +
    '<a class="go" href="https://wenjuan.uc99.com" target="_blank" rel="noopener">前往公开问卷 · wenjuan.uc99.com</a>';

  const olds = stage.querySelectorAll(".step, .result, .ghost");
  olds.forEach(el => {
    el.classList.remove("in");
    el.classList.add("out");
    setTimeout(() => el.remove(), 300);
  });

  setTimeout(() => {
    stage.appendChild(sec);
    requestAnimationFrame(() => requestAnimationFrame(() => sec.classList.add("in")));
  }, 240);

  bar.style.transform = "scaleX(1)";
  counter.classList.add("dim");
  AE.whisper();

  try{
    localStorage.setItem("occupy_answers", JSON.stringify(answers));
  }catch(err){}
}

/* ==========================================================
   四、事件绑定
   ========================================================== */
stage.addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if(!btn) return;
  e.preventDefault();
  pick(btn);
});

stage.addEventListener("input", e => {
  const t = e.target;
  if(t.classList && t.classList.contains("inp")){
    answers[t.dataset.id] = t.value;
    updateHud();
  }
});

document.addEventListener("keydown", e => {
  if(e.key !== "Enter" || e.shiftKey) return;
  const ta = document.activeElement;
  if(ta && ta.tagName === "TEXTAREA"){
    e.preventDefault();
    const nextBtn = stage.querySelector(".nav .next");
    if(nextBtn) nextBtn.click();
  }
});

sndBtn.addEventListener("click", () => {
  if(!AE.ctx) AE.boot();
  AE.resume();
  AE.setMuted(!AE.muted);
  sndBtn.textContent = AE.muted ? "声 音 关" : "声 音 开";
  sndBtn.classList.toggle("off", AE.muted);
});

document.getElementById("startBtn").addEventListener("click", () => {
  if(AE.boot()){
    AE.resume();
    AE.startAmbience();
    AE.click();
  }
  introEl.style.opacity = "0";
  setTimeout(() => {
    introEl.remove();
    rebuildFlow();
    idx = 0;
    render();
  }, 480);
});
</script>
